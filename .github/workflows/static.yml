# Deploy static site to GitHub Pages (Node 24–compatible actions)
name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Refresh sitemap lastmod from git history
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def lastmod(rel):
              path = rel or "index.html"
              out = subprocess.run(
                  ["git", "log", "-1", "--format=%cI", "--", path],
                  capture_output=True, text=True,
              )
              date = out.stdout.strip()[:10] if out.returncode == 0 and out.stdout.strip() else "2026-09-13"
              return date

          base = "https://asutoshdalei.github.io/"
          files = [
              ("", "index.html"),
              ("about.html", "about.html"),
              ("contact.html", "contact.html"),
              ("privacy.html", "privacy.html"),
              ("llms.txt", "llms.txt"),
              ("index.md", "index.md"),
              ("about.md", "about.md"),
              ("contact.md", "contact.md"),
              ("privacy.md", "privacy.md"),
              ("index.txt", "index.txt"),
              (".well-known/mcp", ".well-known/mcp"),
          ]
          sm = Path("sitemap.xml")
          s = sm.read_text(encoding="utf-8")
          for rel, git_path in files:
              loc = base + rel
              s = s.replace(
                  "<loc>" + loc + "</loc>\n\t\t<lastmod>__GIT_DATE__</lastmod>",
                  "<loc>" + loc + "</loc>\n\t\t<lastmod>" + lastmod(git_path) + "</lastmod>",
                  1,
              )
          sm.write_text(s, encoding="utf-8")
          print("sitemap lastmod refreshed for", len(files), "pages")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
